<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem regressiva - Fernanda & Hebert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root { --wine:#7A2E43; --sand:#F4E9DE; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; font-family:'Jost',sans-serif; }
body { min-height:100vh; overflow:hidden; background:#171014; color:#fff; }
.photo-bg { position:fixed; inset:0; display:flex; gap:4px; overflow:hidden; z-index:0; }
.photo-bg::after { content:""; position:absolute; inset:0; background:rgba(13,8,11,.72); backdrop-filter:brightness(.64) blur(1.5px); }
.photo-col { flex:1; display:flex; flex-direction:column; gap:4px; animation:scrollDown 48s linear infinite; }
.photo-col:nth-child(2){animation-duration:58s}.photo-col:nth-child(3){animation-duration:42s}.photo-col:nth-child(4){animation-duration:62s}.photo-col:nth-child(5){animation-duration:52s}
.photo-col img { width:100%; height:34vh; min-height:220px; object-fit:cover; filter:sepia(18%) saturate(85%) brightness(.82); }
@keyframes scrollDown { from{transform:translateY(-50%)} to{transform:translateY(0)} }
main { position:relative; z-index:2; min-height:100vh; display:grid; place-items:center; padding:24px; text-align:center; }
.content { width:min(940px,100%); animation:reveal 1.1s ease both; }
@keyframes reveal { from{opacity:0;transform:scale(.97)} to{opacity:1;transform:scale(1)} }
.eyebrow { margin:0 0 12px; text-transform:uppercase; letter-spacing:.32em; font-size:clamp(11px,1.5vw,15px); }
h1 { margin:0 0 30px; font-family:'Cormorant Garamond',serif; font-size:clamp(40px,7vw,76px); font-style:italic; font-weight:500; text-shadow:0 0 18px rgba(255,255,255,.18); }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(7px,2vw,20px); }
.unit { padding:clamp(16px,3vw,30px) 5px; border:1px solid rgba(255,255,255,.40); background:rgba(255,255,255,.05); box-shadow:0 0 30px rgba(255,255,255,.06); }
.number { display:block; font-size:clamp(36px,8vw,86px); font-weight:300; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 18px rgba(255,255,255,.22); }
.label { display:block; margin-top:11px; text-transform:uppercase; letter-spacing:.18em; font-size:clamp(9px,1.2vw,13px); }
.actions { margin-top:30px; display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
a { font:inherit; color:#fff; border:1px solid rgba(255,255,255,.55); background:rgba(255,255,255,.06); border-radius:999px; padding:11px 19px; cursor:pointer; text-decoration:none; }
a:hover { background:rgba(255,255,255,.14); }
.sound-note { margin:15px 0 0; font-size:12px; opacity:.72; }
@media(max-width:700px){.photo-col:nth-child(4),.photo-col:nth-child(5){display:none}.grid{gap:5px}.unit{padding:17px 2px}.label{letter-spacing:.06em}h1{margin-bottom:22px}}
@media(prefers-reduced-motion:reduce){.photo-col,.content{animation:none}}
</style>
</head>
<body>
<div class="photo-bg" aria-hidden="true">
  <div class="photo-col"><img src="foto1.jpg"><img src="foto4.jpg"><img src="foto7.jpg"><img src="foto1.jpg"><img src="foto4.jpg"><img src="foto7.jpg"></div>
  <div class="photo-col"><img src="foto2.jpg"><img src="foto5.jpg"><img src="foto8.jpg"><img src="foto2.jpg"><img src="foto5.jpg"><img src="foto8.jpg"></div>
  <div class="photo-col"><img src="foto3.jpg"><img src="foto6.jpg"><img src="foto9.jpg"><img src="foto3.jpg"><img src="foto6.jpg"><img src="foto9.jpg"></div>
  <div class="photo-col"><img src="foto5.jpg"><img src="foto1.jpg"><img src="foto9.jpg"><img src="foto5.jpg"><img src="foto1.jpg"><img src="foto9.jpg"></div>
  <div class="photo-col"><img src="foto7.jpg"><img src="foto2.jpg"><img src="foto4.jpg"><img src="foto7.jpg"><img src="foto2.jpg"><img src="foto4.jpg"></div>
</div>
<main>
  <section class="content">
    <p class="eyebrow">Presença confirmada</p>
    <h1>O grande dia está chegando</h1>
    <div class="grid" aria-live="polite">
      <div class="unit"><span class="number" id="days">000</span><span class="label">Dias</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="label">Horas</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutos</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="label">Segundos</span></div>
    </div>
    <div class="actions"><a href="index.html">Voltar ao convite</a></div>
  </section>
</main>
<script>
const weddingDate = new Date('2027-01-31T00:00:00-03:00');
const els = {
  days: document.getElementById('days'),
  hours: document.getElementById('hours'),
  minutes: document.getElementById('minutes'),
  seconds: document.getElementById('seconds')
};
let audioContext = null;
let echoInput = null;
let tickSide = false;

function createOldClockAudio() {
  audioContext = new (window.AudioContext || window.webkitAudioContext)();

  const delay = audioContext.createDelay(1.5);
  const feedback = audioContext.createGain();
  const wet = audioContext.createGain();
  const dry = audioContext.createGain();
  const master = audioContext.createGain();

  delay.delayTime.value = 0.23;
  feedback.gain.value = 0.34;
  wet.gain.value = 0.31;
  dry.gain.value = 0.74;
  master.gain.value = 0.72;

  echoInput = audioContext.createGain();
  echoInput.connect(dry);
  echoInput.connect(delay);
  delay.connect(feedback);
  feedback.connect(delay);
  delay.connect(wet);
  dry.connect(master);
  wet.connect(master);
  master.connect(audioContext.destination);
}

function playOldClockTick() {
  if (!audioContext || audioContext.state !== 'running') return;
  const now = audioContext.currentTime;
  tickSide = !tickSide;

  const osc = audioContext.createOscillator();
  const clickGain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  osc.type = tickSide ? 'square' : 'triangle';
  osc.frequency.setValueAtTime(tickSide ? 920 : 690, now);
  osc.frequency.exponentialRampToValueAtTime(tickSide ? 330 : 270, now + 0.055);
  filter.type = 'bandpass';
  filter.frequency.value = tickSide ? 1300 : 980;
  filter.Q.value = 1.7;
  clickGain.gain.setValueAtTime(0.0001, now);
  clickGain.gain.exponentialRampToValueAtTime(tickSide ? 0.20 : 0.16, now + 0.003);
  clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.095);
  osc.connect(filter);
  filter.connect(clickGain);
  clickGain.connect(echoInput);
  osc.start(now);
  osc.stop(now + 0.11);

  const wood = audioContext.createOscillator();
  const woodGain = audioContext.createGain();
  wood.type = 'sine';
  wood.frequency.setValueAtTime(tickSide ? 170 : 145, now);
  wood.frequency.exponentialRampToValueAtTime(85, now + 0.12);
  woodGain.gain.setValueAtTime(0.0001, now);
  woodGain.gain.exponentialRampToValueAtTime(0.07, now + 0.006);
  woodGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
  wood.connect(woodGain);
  woodGain.connect(echoInput);
  wood.start(now);
  wood.stop(now + 0.16);
}

async function startClockSound() {
  try {
    if (!audioContext) createOldClockAudio();
    if (audioContext.state === 'suspended') await audioContext.resume();
    playOldClockTick();
  } catch (error) {
    console.warn('O navegador bloqueou o áudio automático.', error);
  }
}

function update(playSound = false) {
  const distance = Math.max(0, weddingDate.getTime() - Date.now());
  const days = Math.floor(distance / 86400000);
  const hours = Math.floor((distance % 86400000) / 3600000);
  const minutes = Math.floor((distance % 3600000) / 60000);
  const seconds = Math.floor((distance % 60000) / 1000);
  els.days.textContent = String(days).padStart(3, '0');
  els.hours.textContent = String(hours).padStart(2, '0');
  els.minutes.textContent = String(minutes).padStart(2, '0');
  els.seconds.textContent = String(seconds).padStart(2, '0');
  if (playSound && distance > 0) playOldClockTick();
}

update();
startClockSound();
setInterval(() => update(true), 1000);

// Tentativa extra no primeiro toque, caso o navegador bloqueie o início automático.
document.addEventListener('pointerdown', startClockSound, { once: true });
document.addEventListener('keydown', startClockSound, { once: true });
</script>
</body>
</html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O grande dia está chegando</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Jost,sans-serif}body{min-height:100vh;overflow:hidden;background:#100c0e;color:#fff}.photo-bg{position:fixed;inset:0;display:flex;gap:4px;overflow:hidden}.photo-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,5,7,.58),rgba(8,5,7,.80));backdrop-filter:brightness(.58) blur(1px)}.col{flex:1;display:flex;flex-direction:column;gap:4px;animation:scroll 50s linear infinite}.col:nth-child(2){animation-duration:58s}.col:nth-child(3){animation-duration:42s}.col:nth-child(4){animation-duration:62s}.col:nth-child(5){animation-duration:52s}.col img{width:100%;height:34vh;min-height:220px;object-fit:cover;filter:sepia(18%) saturate(85%) brightness(.82)}@keyframes scroll{from{transform:translateY(-50%)}to{transform:translateY(0)}}
main{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.content{width:min(1040px,100%);padding:clamp(30px,6vw,68px);background:rgba(16,12,14,.74);border:1px solid rgba(191,154,102,.44);box-shadow:0 32px 90px rgba(0,0,0,.5);backdrop-filter:blur(10px);position:relative;animation:reveal 1s ease both}.content:before{content:"";position:absolute;inset:12px;border:1px solid rgba(255,250,244,.14);pointer-events:none}@keyframes reveal{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}.eyebrow{margin:0 0 15px;color:#bf9a66;text-transform:uppercase;letter-spacing:.34em;font-size:clamp(10px,1.3vw,13px)}h1{margin:0 0 20px;font-family:'Cormorant Garamond',serif;font-size:clamp(46px,8vw,88px);line-height:.95;font-style:italic;font-weight:500;text-shadow:0 14px 32px rgba(0,0,0,.55)}.message{max-width:760px;margin:0 auto 28px;font-family:'Cormorant Garamond',serif;font-size:clamp(21px,3vw,32px);line-height:1.35;opacity:0;transform:translateY(14px);animation:message 1.1s .35s forwards}.message strong,.spark{color:#d9b77f;font-weight:500}.spark{display:inline-block;animation:spark 1.4s 2}@keyframes message{to{opacity:1;transform:none}}@keyframes spark{50%{transform:scale(1.25) rotate(8deg);text-shadow:0 0 16px #d9b77fcc}}.line{width:min(420px,70%);height:1px;margin:0 auto 32px;background:linear-gradient(90deg,transparent,#bf9a66,transparent)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(7px,2vw,20px)}.unit{padding:clamp(18px,3.3vw,34px) 4px;border:1px solid rgba(191,154,102,.36);background:rgba(255,250,244,.045)}.number{display:block;font-family:'Cormorant Garamond',serif;font-size:clamp(40px,9vw,94px);line-height:.9;font-variant-numeric:tabular-nums;text-shadow:0 8px 22px #0008}.label{display:block;margin-top:14px;color:#bf9a66;text-transform:uppercase;letter-spacing:.2em;font-size:clamp(8px,1vw,11px)}.signature{margin:30px 0 0;color:#cdb79b;font-size:11px;letter-spacing:.24em;text-transform:uppercase}@media(max-width:700px){.col:nth-child(4),.col:nth-child(5){display:none}.grid{gap:5px}.content{padding:34px 15px}.unit{padding:16px 2px}.label{letter-spacing:.06em}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.message{opacity:1;transform:none}}
</style></head><body><div class="photo-bg" aria-hidden="true"><div class="col"><img src="foto1.jpg"><img src="foto4.jpg"><img src="foto7.jpg"><img src="foto1.jpg"><img src="foto4.jpg"><img src="foto7.jpg"></div><div class="col"><img src="foto2.jpg"><img src="foto5.jpg"><img src="foto8.jpg"><img src="foto2.jpg"><img src="foto5.jpg"><img src="foto8.jpg"></div><div class="col"><img src="foto3.jpg"><img src="foto6.jpg"><img src="foto9.jpg"><img src="foto3.jpg"><img src="foto6.jpg"><img src="foto9.jpg"></div><div class="col"><img src="foto5.jpg"><img src="foto1.jpg"><img src="foto9.jpg"><img src="foto5.jpg"><img src="foto1.jpg"><img src="foto9.jpg"></div><div class="col"><img src="foto7.jpg"><img src="foto2.jpg"><img src="foto4.jpg"><img src="foto7.jpg"><img src="foto2.jpg"><img src="foto4.jpg"></div></div><main><section class="content"><p class="eyebrow">Presença confirmada</p><h1>O grande dia está chegando</h1><p class="message"><span class="spark">✦</span> Que alegria ter você com a gente! <strong>Sua presença tornou esse momento ainda mais especial.</strong> Prepare o coração para celebrar conosco. <span class="spark">✦</span></p><div class="line"></div><div class="grid"><div class="unit"><span class="number" id="days">000</span><span class="label">Dias</span></div><div class="unit"><span class="number" id="hours">00</span><span class="label">Horas</span></div><div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutos</span></div><div class="unit"><span class="number" id="seconds">00</span><span class="label">Segundos</span></div></div><p class="signature">Fernanda &amp; Hebert · 31.01.2027</p></section></main><script>
const wedding=new Date('2027-01-31T00:00:00-03:00'),els={days:document.getElementById('days'),hours:document.getElementById('hours'),minutes:document.getElementById('minutes'),seconds:document.getElementById('seconds')};let ctx,clockOn=false,tickSide=false,clockBus;
function setup(){ctx=new(window.AudioContext||window.webkitAudioContext)();clockBus=ctx.createGain();const delay=ctx.createDelay(1),feedback=ctx.createGain(),wet=ctx.createGain(),dry=ctx.createGain(),master=ctx.createGain();delay.delayTime.value=.16;feedback.gain.value=.16;wet.gain.value=.12;dry.gain.value=.9;master.gain.value=.5;clockBus.connect(dry);clockBus.connect(delay);delay.connect(feedback);feedback.connect(delay);delay.connect(wet);dry.connect(master);wet.connect(master);master.connect(ctx.destination)}
function celebrate(){if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime,m=ctx.createGain();m.gain.setValueAtTime(.0001,t);m.gain.exponentialRampToValueAtTime(.24,t+.03);m.gain.exponentialRampToValueAtTime(.0001,t+2.2);m.connect(ctx.destination);[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const n=t+i*.14,o=ctx.createOscillator(),g=ctx.createGain(),filter=ctx.createBiquadFilter();o.type='sine';o.frequency.value=f;filter.type='lowpass';filter.frequency.value=2400;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.14,n+.018);g.gain.exponentialRampToValueAtTime(.0001,n+1.35);o.connect(filter);filter.connect(g);g.connect(m);o.start(n);o.stop(n+1.4)})}
function noise(d){const l=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,l,ctx.sampleRate),x=b.getChannelData(0);for(let i=0;i<l;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/l,9);return b}
function tick(){if(!clockOn||!ctx||ctx.state!=='running')return;tickSide=!tickSide;const n=ctx.currentTime,s=ctx.createBufferSource(),band=ctx.createBiquadFilter(),low=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noise(tickSide?.065:.075);band.type='bandpass';band.frequency.value=tickSide?1080:820;band.Q.value=1.25;low.type='lowpass';low.frequency.value=1700;g.gain.setValueAtTime(tickSide?.3:.25,n);g.gain.exponentialRampToValueAtTime(.0001,n+.075);s.connect(band);band.connect(low);low.connect(g);g.connect(clockBus);s.start(n)}
function update(play=false){const d=Math.max(0,wedding-Date.now()),days=Math.floor(d/86400000),hours=Math.floor(d%86400000/3600000),minutes=Math.floor(d%3600000/60000),seconds=Math.floor(d%60000/1000);els.days.textContent=String(days).padStart(3,'0');els.hours.textContent=String(hours).padStart(2,'0');els.minutes.textContent=String(minutes).padStart(2,'0');els.seconds.textContent=String(seconds).padStart(2,'0');if(play)tick()}
async function start(){try{if(!ctx)setup();if(ctx.state==='suspended')await ctx.resume();celebrate();setTimeout(()=>{clockOn=true;tick()},2300)}catch(e){console.warn('Áudio bloqueado',e)}}update();start();setInterval(()=>update(clockOn),1000);document.addEventListener('pointerdown',start,{once:true});document.addEventListener('keydown',start,{once:true});
</script></body></html>
